<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuizKey</title>
    <script src="../lib/theme-boot.js"></script>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-key">QK</span>
        <div>
          <h1>QuizKey</h1>
          <p class="tagline">AI quiz assistant</p>
        </div>
      </div>
      <div class="topbar-right">
        <span id="status-pill" class="pill pill-idle">Checking…</span>
        <button id="btn-theme" class="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </header>

    <section class="shortcuts" id="shortcuts">
      <p class="section-label">Shortcuts</p>
      <div id="shortcut-list" class="shortcut-list"></div>
    </section>

    <section class="source">
      <div class="source-head">
        <p class="section-label">Quiz source</p>
        <kbd id="source-hint-key" title="Shortcut to switch">Alt+S</kbd>
      </div>
      <div id="source-switch" class="seg" role="radiogroup" aria-label="Quiz source">
        <button type="button" class="seg-btn" data-source="image" role="radio" aria-checked="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 15-4.5-4.5L9 18"/></svg>
          <span>Image</span>
        </button>
        <button type="button" class="seg-btn" data-source="html" role="radio" aria-checked="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>
          <span>HTML</span>
        </button>
      </div>
      <p id="source-desc" class="source-desc">Screenshots the visible tab — needs a vision model.</p>
    </section>

    <section class="actions">
      <button id="btn-capture" class="btn btn-primary" disabled>
        <span class="btn-title" id="capture-title">Capture &amp; analyze</span>
        <span class="btn-sub" id="capture-hint">Alt+Q</span>
      </button>
      <button id="btn-type" class="btn" disabled>
        <span class="btn-title">Type answer</span>
        <span class="btn-sub" id="type-hint">Alt+A</span>
      </button>
    </section>

    <p id="notice" class="notice" hidden></p>

    <section class="result" id="result" hidden>
      <p class="section-label">Latest analysis</p>
      <p id="result-question" class="result-question"></p>
      <div class="result-answer">
        <span class="result-answer-label">Best answer <span id="result-source" class="result-source"></span></span>
        <span id="result-answer" class="result-answer-text"></span>
      </div>
      <div class="conf">
        <div class="conf-track"><div id="result-conf" class="conf-fill"></div></div>
        <span id="result-conf-num" class="conf-num"></span>
      </div>
    </section>

    <footer class="footbar">
      <button id="btn-options" class="link">Settings</button>
      <span class="dot"></span>
      <span id="model-label" class="model-label"></span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
