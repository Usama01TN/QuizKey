<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07070c" />
    <script>
      // Apply the saved (or OS) theme before the first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("quizkey-theme");
          var light = t ? t === "light" : window.matchMedia("(prefers-color-scheme: light)").matches;
          if (light) {
            document.documentElement.classList.add("light");
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="QuizKey is a Manifest V3 browser extension that captures quiz pages with a shortcut, analyzes them with vision AI, and types answers with realistic per-character keyboard events."
    />
    <title>QuizKey: AI Quiz Assistant Extension</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
