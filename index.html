    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07070c" />
    <script>
      // Apply the saved (or OS) theme before the first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("quizkey-theme");
          var light = t ? t === "light" : window.matchMedia("(prefers-color-scheme: light)").matches;
          if (light) {
            document.documentElement.classList.add("light");
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="QuizKey is a Manifest V3 browser extension that captures quiz pages with a shortcut, analyzes them with vision AI, and types answers with realistic per-character keyboard events."

 * background/service-worker.js
 * The single orchestrator (MV3 module worker).
 *
 * Responsibilities:
 *   - listen for the configured keyboard commands
 *   - capture the visible tab (quiz source "image") or ask the content
 *     script for a cleaned HTML extract (quiz source "html")
 *   - call the AI client
 *   - persist results per tab
 *   - forward everything to the content script
 *   - surface lifecycle state through the action badge
 */
import { getSettings, setSettings, saveResult, getResult, pruneResults } from "../lib/storage.js";
import {
  analyzeScreenshot,
  analyzePageHtml,
  testConnection,
  listModels,
  hasUsableCredentials,
  originPattern,
  resolveApiStyle,
} from "../lib/ai-client.js";
import { QuizKeyError, ErrorCodes, normalizeError } from "../lib/errors.js";
import { classifyPageAccess, hasFileUrlsPermission } from "../lib/page-access.js";

/** Content bundle in manifest load order; used for on-demand injection. */
const CONTENT_STYLE = ["content/overlay.css"];
const CONTENT_FILES = [
  "content/dom-detector.js",
  "content/page-extractor.js",
  "content/typing-simulator.js",
  "content/overlay.js",
  "content/content-script.js",
];

/** Throw a precise, remedy-carrying error when the page can't be used. */
async function assertPageAccessOk(tab) {
  const filePermission = await hasFileUrlsPermission();
  const access = classifyPageAccess(tab?.url, { filePermission });
  if (!access.ok) {
    const userMessage = access.remedy
      ? \`\${access.reason} Fix: \${access.remedy}\`
      : access.reason;
    throw new QuizKeyError(ErrorCodes.RESTRICTED_PAGE, access.reason, undefined, userMessage);
  }
  return access;
}

/* ------------------------------------------------------------------ */
/* Badge helpers                                                        */
/* ------------------------------------------------------------------ */

const badge = {
  async set(tabId, text, color) {
    try {
      await chrome.action.setBadgeText({ tabId, text });
      if (color) await chrome.action.setBadgeBackgroundColor({ tabId, color });
    } catch (_) { /* tab may be gone */ }
  },
  busy: (tabId) => badge.set(tabId, "…", "#8b8cf8"),
  ok: async (tabId) => {
    await badge.set(tabId, "✓", "#22c55e");
    setTimeout(() => void badge.set(tabId, ""), 2500);
  },
  fail: async (tabId) => {
    await badge.set(tabId, "!", "#ef4444");
    setTimeout(() => void badge.set(tabId, ""), 4000);
  },
};

/* ------------------------------------------------------------------ */
/* Messaging with the content script (with graceful failure)            */
/* ------------------------------------------------------------------ */

/**
 * Inject the content bundle on demand. Needed for tabs that were loaded
 * before the extension was installed/reloaded: their content scripts are
 * missing until refresh, but chrome.scripting can attach them right now.
 */
async function injectContentScripts(tabId) {
  try {
    await chrome.scripting
      .insertCSS({ target: { tabId }, files: CONTENT_STYLE })
      .catch(() => {});
    await chrome.scripting.executeScript({ target: { tabId }, files: CONTENT_FILES });
    await new Promise((r) => setTimeout(r, 80)); // let listeners register
    return true;
  } catch (_) {
    return false; // restricted page; the access guard reports the real reason
  }
}

async function sendToTab(tabId, message) {
  try {
    return await chrome.tabs.sendMessage(tabId, message);
  } catch (firstErr) {
    // Content script missing? Attach it on demand, then retry once.
    if (await injectContentScripts(tabId)) {
      try {
        return await chrome.tabs.sendMessage(tabId, message);
      } catch (_) {
        /* fall through to the normalized original error */
      }
    }
    throw normalizeError(firstErr);
  }
}

/** Best-effort and never throws. Used for progress + error reporting. */
async function notifyTab(tabId, message) {
  try {
    await chrome.tabs.sendMessage(tabId, message);
  } catch (_) {
    /* restricted page or script not ready; the badge still communicates */
  }
}

/* ------------------------------------------------------------------ */
/* Screenshot preparation                                               */
/* ------------------------------------------------------------------ */

/**
 * Downscale + re-encode the capture in the worker (OffscreenCanvas).
 * A 4K / HiDPI PNG can exceed 10 MB as base64: slow to upload, expensive
 * in vision tokens and rejected by some providers. Quiz text stays perfectly
 * legible at ~1600 px. Falls back to the original on any failure.
 */
async function prepareImage(dataUrl, settings) {
  const maxEdge = Number(settings.maxImageEdge) || 0;
  if (!maxEdge || typeof OffscreenCanvas === "undefined" || typeof createImageBitmap !== "function") {
    return dataUrl;
  }
  try {
    const blob = await (await fetch(dataUrl)).blob();
    const bitmap = await createImageBitmap(blob);
    const longest = Math.max(bitmap.width, bitmap.height);
    const wantJpeg = settings.captureFormat === "jpeg";
    if (longest <= maxEdge && (!wantJpeg || blob.type === "image/jpeg")) {
      bitmap.close?.();
      return dataUrl;
    }
    const scale = Math.min(1, maxEdge / longest);
    const w = Math.max(1, Math.round(bitmap.width * scale));
    const h = Math.max(1, Math.round(bitmap.height * scale));
    const canvas = new OffscreenCanvas(w, h);
    const ctx = canvas.getContext("2d");
    if (wantJpeg) {
      ctx.fillStyle = "#ffffff"; // JPEG has no alpha, so avoid black backgrounds
      ctx.fillRect(0, 0, w, h);
    }
    ctx.drawImage(bitmap, 0, 0, w, h);
    bitmap.close?.();
    const out = await canvas.convertToBlob(
      wantJpeg
        ? { type: "image/jpeg", quality: settings.jpegQuality ?? 0.85 }
        : { type: "image/png" }
    );
    return await blobToDataUrl(out);
  } catch (err) {
    console.warn("[QuizKey] image downscale skipped:", err);
    return dataUrl;
  }
}

async function blobToDataUrl(blob) {
  const buf = new Uint8Array(await blob.arrayBuffer());
  let binary = "";
  const CHUNK = 0x8000;
  for (let i = 0; i < buf.length; i += CHUNK) {
    binary += String.fromCharCode.apply(null, buf.subarray(i, i + CHUNK));
  }
  return \`data:\${blob.type};base64,\${btoa(binary)}\`;
}

  return \`Connection OK: \${where} answered a test completion with "\${res.model}".\` +
    (res.base && res.base !== base ? \` Tip: set the base URL to "\${res.base}".\` : "");

export async function getResult(tabId) {
  const stored = await chrome.storage.local.get(resultKey(tabId));

  await chrome.storage.local.remove(resultKey(tabId));

 * @param {{ filePermission?: boolean }} [opts] - passed by contexts that

      kind: "unknown",
      short: "Unknown page",
      reason: "QuizKey can't read this tab's address.",
      remedy: "Reload the tab and try again.",
      fixable: false,
      fileAccess: false,
    };
  }

      ok: true,
      kind: "file",
      short: "Local file (file://)",

        remedy: "Open a regular website and run QuizKey there.",
        fixable: false,
        fileAccess: false,

      fixable: false,
      fileAccess: false,

    ok: false,
    kind: "other",
    short: "Restricted page",
    reason: \`Pages served over “\${scheme}//” can't be captured or scripted by extensions.\`,
    remedy: "Open a regular http(s) page.",
    fixable: false,
    fileAccess: false,
  };
}

      if (root.parentNode !== html || html.lastElementChild !== root) {
        html.appendChild(root); // (re)attach; also moves it after any newer siblings
      }
      if (supportsPopover) {
        if (root.getAttribute("popover") !== "manual") root.setAttribute("popover", "manual");
        try {
          if (isOpen(root)) root.hidePopover(); // re-show = move to the top of the top layer
          root.showPopover();
        } catch (_) {
          /* not connected yet or already open, ignore */
        }
      }
    } finally {
      raising = false;
    }
  }

  /** Watch for hostile pages that remove or bury the overlay. */
  function startGuard(root) {
    if (guard || typeof MutationObserver === "undefined") return;
    guard = new MutationObserver(() => {
      if (raising) return;
      const live = document.getElementById(ROOT_ID);
      if (!live || live !== root) {
        // Someone removed our node: put it back with its content intact.
        if (!root.isConnected && root.childElementCount) raise(root);
        return;
      }
      if (root.id !== ROOT_ID) root.id = ROOT_ID;
      const buried = document.documentElement.lastElementChild !== root;
      const closed = root.childElementCount > 0 && supportsPopover && !isOpen(root);
      const tampered = supportsPopover && root.getAttribute("popover") !== "manual";
      if (buried || closed || tampered) raise(root);
    });
    guard.observe(document.documentElement, { childList: true });
    guard.observe(root, { attributes: true, attributeFilter: ["id", "popover", "style", "class"] });

    // Fullscreen elements enter the top layer above us, so climb back on top.
    document.addEventListener("fullscreenchange", () => {
      if (root.childElementCount) raise(root);
    });
  }

  const lightQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;
  const resolveTheme = (mode) =>
    mode === "dark" || mode === "light" ? mode : lightQuery && lightQuery.matches ? "light" : "dark";
  lightQuery?.addEventListener?.("change", () => {
    if (themeMode === "auto") document.getElementById(ROOT_ID)?.setAttribute("data-theme", resolveTheme(themeMode));
  });

  function ensureRoot() {
    let root = document.getElementById(ROOT_ID);
    if (!root) {
      root = document.createElement("div");
      root.id = ROOT_ID;
      root.setAttribute("data-pos", position);
      root.setAttribute("data-theme", resolveTheme(themeMode));
      root.setAttribute("role", "region");
      root.setAttribute("aria-label", "QuizKey");
      if (supportsPopover) root.setAttribute("popover", "manual");
      document.documentElement.appendChild(root);
      startGuard(root);
    }
    raise(root);
    return root;
  }

  function clear() {
    const root = document.getElementById(ROOT_ID);
    if (root) {
      root.innerHTML = "";
      if (isOpen(root)) {
        try {
          root.hidePopover(); // leave the top layer when there is nothing to show
        } catch (_) {
          /* ignore */
        }
      }
    }
    if (dismissTimer) clearTimeout(dismissTimer);
  }

  /** Close (×) button shared by cards and toasts. */
  function closeButton(onClose) {
    const btn = el("button", "qk-close", "×");
    btn.type = "button";
    btn.setAttribute("aria-label", "Close");
    btn.title = "Close";
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      onClose();
    });
    return btn;
  }

  function autoDismiss(ms) {
    if (dismissTimer) clearTimeout(dismissTimer);
    dismissTimer = setTimeout(clear, ms);
  }

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  };

  /* ---------------------------------------------------------------- */

  /** Compact pipeline status chip. @param {"working"|"success"|"error"} tone */
  function showStatus(headline, detail = "", tone = "working") {
    const root = ensureRoot();
    root.innerHTML = "";
    const card = el("div", \`qk-card qk-card-\${tone}\`);
    const row = el("div", "qk-card-row");
    row.appendChild(el("span", \`qk-dot qk-dot-\${tone}\`));
    const col = el("div", "qk-card-text");
    col.appendChild(el("p", "qk-card-title", headline));
    if (detail) col.appendChild(el("p", "qk-card-detail", detail));
    row.appendChild(col);
    card.appendChild(row);
    card.appendChild(closeButton(clear));
    root.appendChild(card);
  }

  /** Full analysis result panel with answer + confidence + actions. */
  function showAnalysis(analysis, { onType, busy = false } = {}) {
    const root = ensureRoot();
    root.innerHTML = "";

    const card = el("div", "qk-card qk-card-analysis");
    card.appendChild(closeButton(clear));
    card.appendChild(el("p", "qk-eyebrow", "Question detected"));

    if (analysis.question) card.appendChild(el("p", "qk-question", analysis.question));

    const best =
      analysis.inputKind === "choice"
        ? \`\${analysis.correctAnswerId ?? ""}. \${analysis.answers?.find?.((a) => a.id === analysis.correctAnswerId)?.text || analysis.answerText || ""}\`.trim()
        : analysis.answerText;

    const answerBox = el("div", "qk-answer");
    answerBox.appendChild(el("span", "qk-answer-label", "Best answer"));
    answerBox.appendChild(el("span", "qk-answer-text", best || "-"));
    card.appendChild(answerBox);

    const confRow = el("div", "qk-conf");
    const track = el("div", "qk-conf-track");
    const fill = el("div", "qk-conf-fill");
    fill.style.width = \`\${Math.round((analysis.confidence || 0) * 100)}%\`;
    track.appendChild(fill);
    confRow.appendChild(track);
    confRow.appendChild(el("span", "qk-conf-num", \`\${Math.round((analysis.confidence || 0) * 100)}%\`));
    card.appendChild(confRow);

    if (analysis.explanation) card.appendChild(el("p", "qk-explain", analysis.explanation));

    const actions = el("div", "qk-actions");
    const typeBtn = el("button", "qk-btn", busy ? "Typing…" : "Type answer  ⌥A");
    typeBtn.disabled = busy;
    typeBtn.addEventListener("click", () => onType?.());
    actions.appendChild(typeBtn);
    card.appendChild(actions);

    root.appendChild(card);
  }

  /** Typing progress bar that fills up as characters land. */
  function showTypingProgress(done, total) {
    showStatus(\`Typing answer…\`, \`\${done} / \${total} characters\`, "working");
    const track = el("div", "qk-conf-track qk-progress");
    const fill = el("div", "qk-conf-fill");
    fill.style.width = \`\${Math.round((done / Math.max(1, total)) * 100)}%\`;
    track.appendChild(fill);
    document.querySelector(\`#\${ROOT_ID} .qk-card\`)?.appendChild(track);
  }

  /** Toast notification. @param {"info"|"success"|"error"} tone */
  function showToast(message, tone = "info", ms = 4200) {
    const root = ensureRoot();
    const icon = tone === "error" ? "!" : tone === "success" ? "✓" : "i";
    const toast = el("div", \`qk-toast qk-toast-\${tone}\`);
    toast.appendChild(el("span", "qk-toast-icon", icon));
    toast.appendChild(el("span", "qk-toast-text", message));
    toast.setAttribute("role", tone === "error" ? "alert" : "status");
    const timer = setTimeout(remove, ms);
    function remove() {
      clearTimeout(timer);
      toast.remove();
      // Nothing left? Step out of the top layer.
      if (root.childElementCount === 0 && isOpen(root)) {
        try {
          root.hidePopover();
        } catch (_) {
          /* ignore */
        }
      }
    }
    toast.appendChild(closeButton(remove));
    root.appendChild(toast);
  }

  // Esc while a QuizKey control is focused closes the overlay (never steals
  // Esc from the page otherwise).
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    const root = document.getElementById(ROOT_ID);
    if (root && root.contains(document.activeElement)) {
      e.stopPropagation();
      clear();
    }
  });

  window.QuizKey.Overlay = Object.freeze({
    clear,
    showStatus,
    showAnalysis,
    showTypingProgress,
    showToast,
    setPosition: (pos) => {
      position = pos;
      document.getElementById(ROOT_ID)?.setAttribute("data-pos", pos);
    },
    /** @param {"auto"|"dark"|"light"} mode */
    setTheme: (mode) => {
      themeMode = mode || "auto";
      document.getElementById(ROOT_ID)?.setAttribute("data-theme", resolveTheme(themeMode));
    },
  });
})();

   QuizKey overlay: namespaced styles (qk-) injected into host pages.

   ------------------------------------------------------------------ */

#quizkey-overlay-root {
  /* theme tokens: dark by default, flipped by [data-theme="light"] */
  --qk-text: #ececf1;
  --qk-surface: rgba(16, 17, 23, 0.96);
  --qk-border: rgba(255, 255, 255, 0.1);
  --qk-border-strong: rgba(255, 255, 255, 0.16);
  --qk-shadow: rgba(0, 0, 0, 0.5);
  --qk-lime: #b4f03c;
  --qk-lime-text: #d6f88a;
  --qk-lime-dim: rgba(180, 240, 60, 0.09);
  --qk-lime-border: rgba(180, 240, 60, 0.28);
  --qk-on-lime: #0c0e04;
  --qk-track: rgba(255, 255, 255, 0.1);
  --qk-green: #4ade80;
  --qk-red: #f87171;
  --qk-viol: #a5a6fa;
  /* The root is a popover (top layer). The UA popover stylesheet sets
     inset:0 / margin:auto / border / padding / background, so reset all of it
     so the root is just an invisible anchor in the chosen corner. The
     !important flags also protect us from aggressive page resets. */
  position: fixed !important;
  inset: auto !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  background: transparent !important;
  overflow: visible !important;
  width: auto !important;
  height: auto !important;
  max-width: none !important;
  max-height: none !important;
  z-index: 2147483647 !important;
  font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  font-size: 13px;
  line-height: 1.45;
  color: var(--qk-text);
  pointer-events: none;
}
#quizkey-overlay-root::backdrop { display: none; background: transparent; }
#quizkey-overlay-root[data-theme="light"] {
  --qk-text: #0e0f16;
  --qk-surface: rgba(255, 255, 255, 0.97);
  --qk-border: rgba(10, 11, 20, 0.12);
  --qk-border-strong: rgba(10, 11, 20, 0.2);
  --qk-shadow: rgba(20, 24, 40, 0.18);

#quizkey-overlay-root[data-pos="bottom-right"] { bottom: 16px !important; right: 16px !important; }
#quizkey-overlay-root[data-pos="bottom-left"]  { bottom: 16px !important; left: 16px !important; }

#quizkey-overlay-root .qk-dot-working { background: var(--qk-lime); animation: qk-pulse 1s ease-in-out infinite; }
#quizkey-overlay-root .qk-dot-success { background: var(--qk-green); }
#quizkey-overlay-root .qk-dot-error { background: var(--qk-red); }
@keyframes qk-pulse { 50% { opacity: 0.35; } }

#quizkey-overlay-root .qk-eyebrow {

  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--qk-lime);

#quizkey-overlay-root .qk-question {

  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
#quizkey-overlay-root .qk-answer {
  background: var(--qk-lime-dim);
  border: 1px solid var(--qk-lime-border);
  border-radius: 10px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#quizkey-overlay-root .qk-answer-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.6; }
#quizkey-overlay-root .qk-answer-text { font-weight: 700; color: var(--qk-lime-text); }

#quizkey-overlay-root .qk-conf { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; }

#quizkey-overlay-root .qk-progress { margin-top: 10px; }
#quizkey-overlay-root .qk-explain { margin: 8px 0 0; font-size: 12px; opacity: 0.6; }

#quizkey-overlay-root .qk-actions { display: flex; gap: 8px; margin-top: 12px; }
#quizkey-overlay-root .qk-btn {
  flex: 1;
  appearance: none;
  border: 0;
  border-radius: 9px;
  padding: 8px 10px;
  font-weight: 700;
  font-size: 12.5px;
  cursor: pointer;

#quizkey-overlay-root .qk-btn:disabled { opacity: 0.55; cursor: wait; }
#quizkey-overlay-root .qk-btn-ghost { background: transparent; color: var(--qk-text); border: 1px solid var(--qk-border-strong); }

#quizkey-overlay-root .qk-toast {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  width: 340px;
  cursor: pointer;
}
#quizkey-overlay-root .qk-toast-icon {
  flex: none;
  width: 20px;
  height: 20px;
  border-radius: 7px;
  display: grid;

  font-weight: 800;

#quizkey-overlay-root .qk-toast-info    .qk-toast-icon { background: rgba(139, 140, 248, 0.2); color: var(--qk-viol); }
#quizkey-overlay-root .qk-toast-success .qk-toast-icon { background: rgba(74, 222, 128, 0.18); color: var(--qk-green); }

#quizkey-overlay-root .qk-toast-text { padding-top: 1px; }

  outline: 2px dashed rgba(139, 140, 248, 0.85) !important;
  outline-offset: 4px !important;
  border-radius: 6px !important;

html, body { transition: background-color 0.2s ease, color 0.2s ease; }
* { box-sizing: border-box; }
body {
  width: 340px;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  font-size: 13px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 10px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-key {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: linear-gradient(180deg, var(--key-top), var(--key-bottom));
  border: 1px solid var(--border);
  border-bottom-width: 3px;
  color: var(--lime);
  font-weight: 800;
  font-size: 12px;
  letter-spacing: 0.06em;
}
h1 { font-size: 15px; margin: 0; font-weight: 700; }
.tagline { margin: 0; font-size: 11px; color: var(--muted); }

.pill {
  font-size: 10.5px;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 99px;
  letter-spacing: 0.02em;
}
.pill-idle { background: var(--track); color: var(--muted); }
.pill-ok { background: var(--lime-dim); color: var(--lime); }
.pill-warn { background: rgba(248, 113, 113, 0.14); color: var(--red); }

.section-label {
  margin: 0 0 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.shortcuts { padding: 4px 16px 10px; }
.shortcut-list { display: grid; gap: 6px; }
.shortcut-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
}
.shortcut-row span { color: var(--muted); font-size: 12px; }
kbd {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 11px;
  font-weight: 700;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 6px;
  padding: 2px 7px;
  color: var(--lime);
}

/* ---------- quiz source switcher (Image / HTML) ---------- */
.source { padding: 2px 16px 8px; }
.source-head { display: flex; align-items: center; justify-content: space-between; }
.source-head kbd { font-size: 10px; padding: 1px 6px; color: var(--muted); margin-bottom: 8px; }
.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--border);
}
.seg-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 10px;
  border-radius: 9px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.seg-btn svg { width: 14px; height: 14px; }
.seg-btn:hover { color: var(--text); }
.seg-btn[aria-checked="true"] {
  background: var(--lime-dim);
  border-color: rgba(180, 240, 60, 0.45);
  color: var(--lime);
}
.seg-btn:focus-visible { outline: 2px solid var(--lime); outline-offset: 1px; }
.seg-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.source-desc { margin: 8px 0 0; font-size: 11.5px; line-height: 1.45; color: var(--muted); }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px 16px 12px; }
.btn {
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: flex-start;
  padding: 10px 12px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  text-align: left;
  transition: transform 0.08s ease, border-color 0.15s ease, filter 0.15s ease;
}
.btn:hover:not(:disabled) { border-color: rgba(180, 240, 60, 0.4); }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--lime); border-color: var(--lime); color: var(--on-lime); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn-title { font-weight: 750; font-size: 12.5px; }
.btn-sub { font-size: 10.5px; opacity: 0.65; font-family: ui-monospace, Menlo, monospace; }

.notice {
  margin: 0 16px 10px;
  padding: 9px 11px;
  border-radius: 10px;
  background: rgba(248, 113, 113, 0.1);
  border: 1px solid rgba(248, 113, 113, 0.25);
  color: var(--red-soft);
  font-size: 12px;
  line-height: 1.55;
  white-space: pre-line;
}
.notice[data-tone="info"] {
  background: rgba(139, 140, 248, 0.08);
  border-color: rgba(139, 140, 248, 0.25);
  color: var(--viol-text);
}

.result { padding: 2px 16px 12px; }
.result-question {
  margin: 0 0 8px;
  font-weight: 600;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.result-answer {
  background: var(--lime-dim);
  border: 1px solid rgba(180, 240, 60, 0.28);
  border-radius: 10px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.result-answer-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); display: flex; justify-content: space-between; }
.result-source { color: var(--viol-text); letter-spacing: 0.08em; }
.result-answer-text { font-weight: 750; color: var(--lime-text); }
.conf { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.conf-track { flex: 1; height: 5px; border-radius: 99px; background: var(--track); overflow: hidden; }
.conf-fill { height: 100%; background: linear-gradient(90deg, var(--lime), var(--green)); }
.conf-num { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

.footbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px 13px;
  border-top: 1px solid var(--border);
  margin-top: 4px;
}
.link {
  background: none;
  border: 0;
  color: var(--lime);
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  padding: 0;
}
.dot { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); }
.model-label { font-size: 11px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }

/* ---------- theme toggle (Sun / Moon) ---------- */
.theme-toggle {
  position: relative;
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel-2, var(--panel));
  color: var(--muted);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.theme-toggle:hover { color: var(--text); border-color: var(--lime); }
.theme-toggle:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.theme-toggle svg {
  position: absolute; width: 14px; height: 14px;
  transition: transform 0.3s ease, opacity 0.3s ease;
}
.theme-toggle .icon-sun  { opacity: 1; transform: rotate(0) scale(1); }
.theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg) scale(0); }
:root[data-theme="light"] .theme-toggle .icon-sun  { opacity: 0; transform: rotate(-90deg) scale(0); }
:root[data-theme="light"] .theme-toggle .icon-moon { opacity: 1; transform: rotate(0) scale(1); }

button:not(:disabled) { cursor: pointer; }

.topbar-right { display: flex; align-items: center; gap: 8px; }

 * popup/popup.js (ES module)
 * Quick-action panel: page-access diagnosis, live status, configured
 * shortcuts, latest analysis, and one-click triggers that mirror the
 * keyboard shortcuts.
 */
import { classifyPageAccess, hasFileUrlsPermission } from "../lib/page-access.js";
import { setSettings, onSettingsChanged } from "../lib/storage.js";
import { initTheme } from "../lib/theme.js";

(() => {
  "use strict";

  const $ = (sel) => document.querySelector(sel);

  const els = {
    statusPill: $("#status-pill"),
    shortcutList: $("#shortcut-list"),
    btnCapture: $("#btn-capture"),
    captureTitle: $("#capture-title"),
    sourceSwitch: $("#source-switch"),
    sourceDesc: $("#source-desc"),
    sourceHintKey: $("#source-hint-key"),
    resultSource: $("#result-source"),
    btnType: $("#btn-type"),
    notice: $("#notice"),
    result: $("#result"),
    resultQuestion: $("#result-question"),
    resultAnswer: $("#result-answer"),
    resultConf: $("#result-conf"),
    resultConfNum: $("#result-conf-num"),
    btnOptions: $("#btn-options"),
    modelLabel: $("#model-label"),
  };

  let activeTabId = null;
  /** @type {"image"|"html"} */
  let captureSource = "image";

  const SOURCE_COPY = {
    image: {
      title: "Capture & analyze",
      desc: "Screenshots the visible tab. Needs a vision-capable model.",
    },
    html: {
      title: "Read page & analyze",
      desc: "Sends a cleaned extract of the visible quiz HTML. Works with any text model. Select text on the page to analyze just that part.",
    },
  };

  /** Reflect the active quiz source in the switcher + capture button. */
  function renderSource(source) {
    captureSource = source === "html" ? "html" : "image";
    for (const btn of els.sourceSwitch.querySelectorAll(".seg-btn")) {
      const on = btn.dataset.source === captureSource;
      btn.setAttribute("aria-checked", String(on));
      btn.tabIndex = on ? 0 : -1;
    }
    els.captureTitle.textContent = SOURCE_COPY[captureSource].title;
    els.sourceDesc.textContent = SOURCE_COPY[captureSource].desc;
  }

  async function chooseSource(source) {
    if (source === captureSource) return;
    renderSource(source);
    await setSettings({ captureSource: source }).catch(() => {});
  }

  /* ---------------------------------------------------------------- */

  function setStatus(tone, label) {
    els.statusPill.className = \`pill pill-\${tone}\`;
    els.statusPill.textContent = label;
  }

  /** @param {"error"|"info"} tone */
  function showNotice(text, tone = "error") {
    els.notice.hidden = !text;
    els.notice.textContent = text || "";
    els.notice.dataset.tone = tone;
  }

  function describeError(payload) {
    if (payload?.error?.userMessage) return payload.error.userMessage;
    return "Something went wrong. Check the settings page.";
  }

  function renderAnalysis(analysis) {
    if (!analysis) {
      els.result.hidden = true;
      return;
    }
    const best =
      analysis.inputKind === "choice"
        ? \`\${analysis.correctAnswerId ?? ""}. \${
            analysis.answers?.find?.((a) => a.id === analysis.correctAnswerId)?.text ||
            analysis.answerText ||
            ""
          }\`.trim()
        : analysis.answerText;

    els.result.hidden = false;
    els.resultQuestion.textContent = analysis.question || "-";
    els.resultAnswer.textContent = best || "-";
    const pct = Math.round((analysis.confidence || 0) * 100);
    els.resultConf.style.width = \`\${pct}%\`;
    els.resultConfNum.textContent = \`\${pct}% confident\`;
    els.resultSource.textContent = analysis.source === "html" ? "via HTML" : analysis.source === "image" ? "via image" : "";
  }

  async function renderShortcuts() {
    try {
      const commands = await chrome.commands.getAll();
      els.shortcutList.innerHTML = "";
      const labels = {
        "capture-and-answer": "Capture & analyze",
        "type-answer": "Type answer",
        "toggle-quiz-source": "Switch source",
      };
      for (const cmd of commands.filter((c) => labels[c.name])) {
        const row = document.createElement("div");
        row.className = "shortcut-row";

        const name = document.createElement("span");
        name.textContent = labels[cmd.name];

        const key = document.createElement("kbd");
        key.textContent = cmd.shortcut || "Not set";
        if (cmd.name === "capture-and-answer") $("#capture-hint").textContent = cmd.shortcut || "Not set";
        if (cmd.name === "type-answer") $("#type-hint").textContent = cmd.shortcut || "Not set";
        if (cmd.name === "toggle-quiz-source") els.sourceHintKey.textContent = cmd.shortcut || "Not set";

        row.append(name, key);
        els.shortcutList.appendChild(row);
      }
    } catch (_) {
      /* commands API unavailable, leave the section empty */
    }
  }

  async function loadState() {
    const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
    activeTabId = tab?.id ?? null;
    if (!activeTabId) {
      setStatus("warn", "No active tab");
      return;
    }

    const filePermission = await hasFileUrlsPermission();
    const access = classifyPageAccess(tab?.url, { filePermission });

    const state = await chrome.runtime
      .sendMessage({ type: "QUIZKEY_POPUP_STATE", tabId: activeTabId })
      .catch(() => null);

    if (!state) {
      setStatus("warn", "Unavailable");
      showNotice("QuizKey cannot reach the background worker. Reload the extension once.");
      return;
    }

    els.modelLabel.textContent = \`\${state.settings.model || "auto model"} · \${state.apiStyle || "openai"}\`;
    renderSource(state.settings.captureSource);
    renderAnalysis(state.analysis);

    /* 1. Fully restricted pages: name the exact restriction + remedy */
    if (!access.ok) {
      setStatus("warn", access.short);
      showNotice(
        access.remedy ? \`\${access.reason}\\n\\nHow to fix: \${access.remedy}\` : access.reason,
        "error"
      );
      els.btnCapture.disabled = true;
      els.btnType.disabled = true;
      return;
    }

    /* 2. Allowed to use: credentials / file-grant / injection notices */
    const needsKey = !state.hasApiKey;
    let notice = "";
    if (needsKey) {
      notice = "Add your AI API key in settings to enable capture (local servers like Ollama / LM Studio don't need one).";
    }
    // file:// pages capture fine without the grant; typing/overlay need it
    if (access.kind === "file" && !access.fileAccess) {
      notice =
        "Capture works on this file. To type answers and show the overlay here, enable file access in QuizKey Settings (“Allow access to local files”), or Chrome’s toggle under QuizKey → Details, then reload this file.";
    } else if (!needsKey && !state.pageReachable) {
      notice =
        "QuizKey isn't attached to this tab yet (it was loaded before install). It will inject itself automatically on capture. If that fails, reload this tab once.";
    }
    showNotice(notice, "info");
    setStatus(needsKey ? "warn" : "ok", needsKey ? "API key needed" : "Ready");

    els.btnCapture.disabled = !state.hasApiKey;
    els.btnType.disabled = !state.analysis;
  }

  async function runAction(action) {
    const button = action === "capture" ? els.btnCapture : els.btnType;
    button.disabled = true;
    showNotice("");
    if (action === "capture") setStatus("idle", "Working…");
    try {
      const response = await chrome.runtime.sendMessage({
        type: "QUIZKEY_POPUP_ACTION",
        action,
        tabId: activeTabId,
        source: action === "capture" ? captureSource : undefined,
      });
      if (response?.error) {
        showNotice(describeError(response));
        setStatus("warn", "Failed");
        return;
      }
      if (response?.question || response?.answerText) {
        renderAnalysis(response);
        els.btnType.disabled = false;
      }
      setStatus("ok", "Ready");
    } catch (err) {
      showNotice(String(err?.message || err));
      setStatus("warn", "Failed");
    } finally {
      button.disabled = false;
    }
  }

  els.btnCapture.addEventListener("click", () => void runAction("capture"));

  els.sourceSwitch.addEventListener("click", (e) => {
    const btn = e.target.closest?.(".seg-btn");
    if (btn?.dataset.source) void chooseSource(btn.dataset.source);
  });
  // Arrow keys move between the two options like a native radio group.
  els.sourceSwitch.addEventListener("keydown", (e) => {
    if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) return;
    e.preventDefault();
    const next = captureSource === "image" ? "html" : "image";
    void chooseSource(next);
    els.sourceSwitch.querySelector(\`[data-source="\${next}"]\`)?.focus();
  });
  // Stay in sync if the source is flipped elsewhere (Alt+S or the options page).
  onSettingsChanged((settings) => {
    if (settings?.captureSource && settings.captureSource !== captureSource) renderSource(settings.captureSource);
  });
  els.btnType.addEventListener("click", () => void runAction("type"));
  els.btnOptions.addEventListener("click", () => chrome.runtime.openOptionsPage());

  void initTheme({ toggle: $("#btn-theme") });
  void loadState();
  void renderShortcuts();
})();

function persistLater(patch, ms = 220) {
  els.saveState.textContent = "Saving…";
  els.saveState.className = "save-state dirty";
  clearTimeout(writeTimer);
  writeTimer = setTimeout(() => {
    void setSettings(patch).then(markSaved);
  }, ms);
}

async function hydrate() {
  const s = await getSettings();
  els.apiBaseUrl.value = s.apiBaseUrl;
  els.apiKey.value = s.apiKey;
  els.apiStyle.value = s.apiStyle || "auto";
  els.model.value = s.model;
  els.maxOutputTokens.value = s.maxOutputTokens;
  els.maxImageEdge.value = s.maxImageEdge;
  els.extraInstructions.value = s.extraInstructions;
  renderSource(s.captureSource);
  els.htmlScope.value = s.htmlScope || "viewport";
  els.htmlMaxChars.value = s.htmlMaxChars;
  els.captureFormat.value = s.captureFormat;
  els.jpegQuality.value = Math.round(s.jpegQuality * 100);
  els.typingDelayMs.value = s.typingDelayMs;
  els.typingJitterMs.value = s.typingJitterMs;
  els.autoType.checked = s.autoType;
  els.clickChoice.checked = s.clickChoice;
  els.highlightMatches.checked = s.highlightMatches;
  els.overlayPosition.value = s.overlayPosition;
  els.theme.value = s.theme || "auto";
  syncOutputs();
  detectPreset(s.provider || "custom");
  syncKeyHint();
  void refreshGrantState();
}

/** Local servers don't need a key, so say so instead of demanding one. */
function syncKeyHint() {
  const local = isLocalEndpoint(els.apiBaseUrl.value);
  const p = getProvider(els.providerPreset.value);
  els.keyHint.textContent = local ? "(optional for local servers)" : "(required)";
  els.apiKey.placeholder = local
    ? p.id === "omniroute" ? "key from OmniRoute Dashboard → Endpoints" : "leave empty unless your server needs one"
    : p.id === "anthropic" ? "sk-ant-…" : p.id.startsWith("gemini") ? "AIza…" : "sk-…";
}

/** Reflect the current endpoint back onto the preset dropdown + hints. */
function detectPreset(fallbackId = "custom") {
  const hit = detectProvider(els.apiBaseUrl.value);
  els.providerPreset.value = hit ? hit.id : fallbackId;
  renderProviderNote(getProvider(els.providerPreset.value));
  syncStyleHint();
}

function renderProviderNote(p) {
  els.providerNote.innerHTML = "";
  if (!p) return;
  els.providerNote.append(p.note || "");
  if (p.docsUrl) els.providerNote.append(" ", link(p.docsUrl, "Docs"));
  els.keyLink.innerHTML = "";
  if (p.keyUrl && p.needsKey) els.keyLink.append("Get a key: ", link(p.keyUrl, p.keyUrl.replace(/^https?:\\/\\//, "")));
  if (p.altModels?.length) {
    els.modelList.innerHTML = "";
    for (const m of [p.model, ...p.altModels].filter(Boolean)) {
      const o = document.createElement("option");
      o.value = m;
      els.modelList.appendChild(o);
    }
  }
}

function syncStyleHint() {
  const style = resolveApiStyle({ apiStyle: els.apiStyle.value, apiBaseUrl: els.apiBaseUrl.value });
  const auto = els.apiStyle.value === "auto";
  const names = { openai: "OpenAI Chat Completions", gemini: "Google Gemini native", anthropic: "Anthropic Messages" };
  els.styleDetected.textContent = auto ? \`Detected: \${names[style] || style}\` : \`Pinned: \${names[style] || style}\`;
}

function syncOutputs() {
  els.jpegQualityOut.textContent = \`\${els.jpegQuality.value}%\`;
  els.typingDelayOut.textContent = \`\${els.typingDelayMs.value} ms\`;
  els.typingJitterOut.textContent = \`\${els.typingJitterMs.value} ms\`;
}

function currentSnapshot() {
  return {
    provider: els.providerPreset.value,
    apiStyle: els.apiStyle.value,
    apiBaseUrl: normalizeBaseUrl(els.apiBaseUrl.value),
    apiKey: els.apiKey.value.trim(),
    model: els.model.value.trim(),
    maxOutputTokens: Number(els.maxOutputTokens.value) || DEFAULT_SETTINGS.maxOutputTokens,
    maxImageEdge: Math.max(0, Number(els.maxImageEdge.value) || 0),
    requestTimeoutMs: DEFAULT_SETTINGS.requestTimeoutMs,
    extraInstructions: els.extraInstructions.value,
    captureSource,
    htmlScope: els.htmlScope.value,
    htmlMaxChars: Math.max(1000, Number(els.htmlMaxChars.value) || DEFAULT_SETTINGS.htmlMaxChars),
    captureFormat: els.captureFormat.value,
    jpegQuality: Number(els.jpegQuality.value) / 100,
    typingDelayMs: Number(els.typingDelayMs.value),
    typingJitterMs: Number(els.typingJitterMs.value),
    autoType: els.autoType.checked,
    clickChoice: els.clickChoice.checked,
    highlightMatches: els.highlightMatches.checked,
    overlayPosition: els.overlayPosition.value,
    theme: els.theme.value,

/* ------------------------------------------------------------------ */
/* Optional host permission for custom endpoints                       */
/* ------------------------------------------------------------------ */

/**
 * The manifest grants OpenAI, Gemini and OpenRouter. Every other origin
 * (OmniRoute, LM Studio, Ollama, Azure, a proxy…) must be granted at
 * runtime. Without it the background fetch is at the mercy of CORS, which
 * local servers usually block: the #1 reason "nothing happens" on capture.
 *
 * chrome.permissions.request() needs a user gesture, so we call it from
 * the change events of the URL/preset controls and from the buttons.
 */
async function hasEndpointPermission() {
  const pattern = originPattern(els.apiBaseUrl.value);
  if (!pattern) return false;
  try {
    return await chrome.permissions.contains({ origins: [pattern] });
  } catch (_) {
    return false;
  }
}

async function ensureEndpointPermission() {
  const pattern = originPattern(els.apiBaseUrl.value);
  if (!pattern) return false;
  try {
    if (await chrome.permissions.contains({ origins: [pattern] })) return true;
    return await chrome.permissions.request({ origins: [pattern] });
  } catch (_) {
    return false;
  } finally {
    void refreshGrantState();
  }
}

async function refreshGrantState() {
  const pattern = originPattern(els.apiBaseUrl.value);
  if (!pattern) {
    els.grantState.textContent = "";
    els.btnGrant.disabled = true;
    return;
  }
  const granted = await hasEndpointPermission();
  els.btnGrant.disabled = granted;
  els.btnGrant.textContent = granted ? "Access granted" : "Grant access";
  els.grantState.textContent = granted
    ? ""
    : \`QuizKey needs permission to contact \${pattern.replace(/\\/\\*$/, "")}. Click "Grant access".\`;
  els.grantState.className = granted ? "test-result ok" : "test-result err";
}

els.btnGrant.addEventListener("click", async () => {
  const ok = await ensureEndpointPermission();
  if (!ok) {
    els.grantState.textContent = "Permission was not granted. Capture will likely fail on this endpoint.";
    els.grantState.className = "test-result err";
  }
});

chrome.permissions?.onAdded?.addListener(() => void refreshGrantState());
chrome.permissions?.onRemoved?.addListener(() => void refreshGrantState());

/* ------------------------------------------------------------------ */
/* Test connection · Load models · Diagnostic · Call log               */
/* ------------------------------------------------------------------ */

/** Everything runs through the worker so it behaves exactly like a capture. */
function askWorker(type, extra = {}) {
  return chrome.runtime.sendMessage({ type, settings: currentSnapshot(), ...extra });
}

function setResult(text, tone) {
  els.testResult.textContent = text;
  els.testResult.className = \`test-result \${tone || ""}\`.trim();
}

async function prepareForCall() {
  const normalized = normalizeBaseUrl(els.apiBaseUrl.value);
  if (normalized && normalized !== els.apiBaseUrl.value.trim()) {
    els.apiBaseUrl.value = normalized;
    detectPreset();
    syncKeyHint();
  }
  await persist(currentSnapshot());
  const granted = await ensureEndpointPermission();
  if (!granted) {
    setResult("Host permission was not granted; the request may be blocked by CORS. Trying anyway…", "err");
  }
}

els.btnTest.addEventListener("click", async () => {
  setResult("Checking…");
  els.btnTest.disabled = true;
  try {
    await prepareForCall();
    const res = await askWorker("QUIZKEY_TEST_CONNECTION");
    if (res?.ok) setResult(res.message, "ok");
    else setResult(res?.error?.userMessage || "Test failed.", "err");
  } catch (err) {
    setResult(toUserMessage(err), "err");
  } finally {
    els.btnTest.disabled = false;
    void refreshLog();
  }
});

els.btnModels.addEventListener("click", async () => {
  els.modelsState.textContent = "Loading…";
  els.btnModels.disabled = true;
  try {
    await prepareForCall();
    const res = await askWorker("QUIZKEY_LIST_MODELS");
    if (!res?.ok) {
      els.modelsState.textContent = res?.error?.userMessage || "Could not list models.";
      return;
    }
    const models = res.models || [];
    els.modelList.innerHTML = "";
    for (const m of models) {
      const o = document.createElement("option");
      o.value = m;
      els.modelList.appendChild(o);
    }
    const current = els.model.value.trim();
    els.modelsState.textContent = models.length
      ? \`\${models.length} model\${models.length === 1 ? "" : "s"} available. Start typing in the Model box to pick one.\` +
        (current && !models.includes(current) ? \` Note: "\${current}" is not among them.\` : "")
      : "The provider returned an empty model list.";
    if (!current && models.length) {
      els.model.value = models[0];
      void persist({ model: models[0] });
    }
  } catch (err) {
    els.modelsState.textContent = toUserMessage(err);
  } finally {
    els.btnModels.disabled = false;
    void refreshLog();
  }
});

/** A synthetic quiz screenshot so the pipeline can be tested without a tab. */
function sampleQuizImage() {
  const canvas = document.createElement("canvas");
  canvas.width = 900;
  canvas.height = 520;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#111827";
  ctx.font = "bold 30px Arial";
  ctx.fillText("Geography Quiz: Question 3 of 10", 40, 70);
  ctx.font = "26px Arial";
  ctx.fillText("What is the capital city of France?", 40, 140);
  ctx.font = "24px Arial";
  const opts = ["A. Rome", "B. Paris", "C. Madrid", "D. Berlin"];
  opts.forEach((t, i) => {
    ctx.strokeStyle = "#9ca3af";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(60, 200 + i * 56, 11, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillText(t, 90, 208 + i * 56);
  });
  ctx.strokeStyle = "#6b7280";
  ctx.strokeRect(40, 440, 520, 48);
  ctx.fillStyle = "#9ca3af";
  ctx.font = "20px Arial";
  ctx.fillText("Type your answer here…", 52, 471);
  return canvas.toDataURL("image/jpeg", 0.9);
}

/** The same sample quiz as a cleaned HTML extract (what page-extractor.js emits). */
function sampleQuizHtml() {
  return [
    "<h2>Geography Quiz: Question 3 of 10</h2>",
    "<p>What is the capital city of France?</p>",
    "<ul>",
    '<li><label><input type="radio" name="q3" value="a"> A. Rome</label></li>',
    '<li><label><input type="radio" name="q3" value="b"> B. Paris</label></li>',
    '<li><label><input type="radio" name="q3" value="c"> C. Madrid</label></li>',
    '<li><label><input type="radio" name="q3" value="d"> D. Berlin</label></li>',
    "</ul>",
    '<input type="text" name="answer" placeholder="Type your answer here…">',
    '<button type="submit">Submit</button>',
  ].join("\\n");
}

els.btnDiagnose.addEventListener("click", async () => {
  const viaHtml = captureSource === "html";
  setResult(\`Running the sample quiz (\${viaHtml ? "HTML" : "image"} source) through the analysis pipeline…\`);
  els.btnDiagnose.disabled = true;
  try {
    await prepareForCall();
    const res = viaHtml
      ? await askWorker("QUIZKEY_ANALYZE_HTML", {
          html: sampleQuizHtml(),
          meta: { title: "Geography Quiz", url: "https://example.test/quiz/3", scope: "viewport" },
        })
      : await askWorker("QUIZKEY_ANALYZE_IMAGE", { dataUrl: sampleQuizImage() });
    if (res?.ok) {
      const a = res.analysis;
      const best = a.inputKind === "choice"
        ? \`\${a.correctAnswerId ?? ""}. \${a.answers?.find((x) => x.id === a.correctAnswerId)?.text || a.answerText || ""}\`.trim()
        : a.answerText;
      const verdict = /paris/i.test(best || "") ? "✓ Pipeline works." : "⚠ Pipeline works but the model answered unexpectedly:";
      setResult(
        \`\${verdict}\\nModel: \${a.model} (\${a.apiStyle} API · \${a.source || (viaHtml ? "html" : "image")} source)\\nQuestion read: \${a.question || "(none)"}\\nAnswer: \${best || "(none)"} (\${Math.round((a.confidence || 0) * 100)}% confident)\` +
          (a.explanation ? \`\\n\${a.explanation}\` : ""),
        "ok"
      );
    } else {
      setResult(\`✗ \${res?.error?.userMessage || "Diagnostic failed."}\\n(\${res?.error?.code || "?"}) \${res?.error?.message || ""}\`.trim(), "err");
    }
  } catch (err) {
    setResult(toUserMessage(err), "err");
  } finally {
    els.btnDiagnose.disabled = false;
    void refreshLog();
  }
});

async function refreshLog() {
  const entries = await readCallLog();
  els.logCount.textContent = entries.length ? \`(\${entries.length})\` : "";
  if (!entries.length) {
    els.logBody.textContent = "No calls yet.";
    return;
  }
  els.logBody.textContent = entries
    .slice()
    .reverse()
    .map((e) => {
      const t = new Date(e.at).toLocaleTimeString();
      return \`\${t}  \${e.label || "call"}  \${e.method} \${e.url}\\n        → \${e.status}\${e.ms != null ? \` in \${e.ms} ms\` : ""}\${e.error ? \`  \${e.error}\` : ""}\`;
    })
    .join("\\n");
}

els.btnLogClear.addEventListener("click", async () => {
  await clearCallLog();
  void refreshLog();
});

/* ------------------------------------------------------------------ */
/* Live typing preview (mirrors the content-script cadence)            */
/* ------------------------------------------------------------------ */

const PREVIEW_TEXT = "Saturn";

let previewTimer = null;

function runPreview() {
  clearTimeout(previewTimer);
  els.previewField.value = "";
  const delay = Number(els.typingDelayMs.value);
  const jitter = Number(els.typingJitterMs.value);
  let i = 0;
  const step = () => {
    if (i >= PREVIEW_TEXT.length) return;
    els.previewField.value += PREVIEW_TEXT[i];
    els.previewField.dispatchEvent(new Event("input", { bubbles: true }));
    let d = delay + Math.floor(Math.random() * (jitter + 1));
    if (PREVIEW_TEXT[i] === " ") d *= 1.6;
    i += 1;
    previewTimer = setTimeout(step, Math.round(d));
  };
  previewTimer = setTimeout(step, 250);
}

els.btnPreview.addEventListener("click", runPreview);

els.btnFileAccess.addEventListener("click", async () => {
  els.btnFileAccess.disabled = true;
  els.fileAccessState.textContent = "Requesting…";
  els.fileAccessState.className = "test-result";

  if (granted) {

  els.fileAccessState.innerHTML = "";

    "Request was dismissed. You can also enable Chrome's native switch on the ",

  const link = document.createElement("a");

  link.target = "_blank";
  link.rel = "noreferrer";
  link.style.color = "inherit";
  link.style.textDecoration = "underline";
  els.fileAccessState.append(link, ".");
  els.fileAccessState.className = "test-result err";

/* ------------------------------------------------------------------ */
/* Shortcut editor                                                     */
/* ------------------------------------------------------------------ */

const MODIFIERS = new Set(["Alt", "Control", "Shift", "Meta"]);

function comboFromEvent(e) {
  const parts = [];
  if (e.ctrlKey) parts.push("Ctrl");
  if (e.metaKey) parts.push("MacCtrl");
  if (e.altKey) parts.push("Alt");
  if (e.shiftKey) parts.push("Shift");
  if (MODIFIERS.has(e.key)) return null; // modifier-only press
  let key = e.key;
  if (key === " ") key = "Space";
  if (key.length === 1) key = key.toUpperCase();
  parts.push(key);
  return parts.join("+");
}

async function renderShortcutEditor() {
  const commands = await chrome.commands.getAll().catch(() => []);
  els.shortcutEditor.innerHTML = "";
  const canUpdate = typeof chrome.commands.update === "function";

  const toggleCmd = commands.find((c) => c.name === "toggle-quiz-source");
  if (els.toggleKey) els.toggleKey.textContent = toggleCmd?.shortcut || "Not set";

  for (const cmd of commands.filter((c) => COMMAND_LABELS[c.name])) {
    const row = document.createElement("div");
    row.className = "shortcut-edit-row";
    const label = document.createElement("span");
    label.textContent = COMMAND_LABELS[cmd.name];
    const key = document.createElement("kbd");
    key.tabIndex = 0;
    key.textContent = cmd.shortcut || "Click to record";

    key.addEventListener("click", () => {
      key.classList.add("recording");
      key.textContent = "Press keys…";
      key.focus();
    });
    key.addEventListener("blur", () => {
      key.classList.remove("recording");
      key.textContent = cmd.shortcut || "Click to record";
    });
    key.addEventListener("keydown", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (e.key === "Escape") {
        key.blur();
        return;
      }
      const combo = comboFromEvent(e);
      if (!combo) return;

      if (canUpdate) {
        try {
          await chrome.commands.update({ name: cmd.name, shortcut: combo });
          cmd.shortcut = combo;
          key.textContent = combo;
        } catch (err) {
          key.textContent = "Rejected";
          setTimeout(() => (key.textContent = cmd.shortcut || "Click to record"), 1200);
        }
      } else {
        key.textContent = "Use chrome://extensions/shortcuts";
        setTimeout(() => (key.textContent = cmd.shortcut || "Click to record"), 1600);
      }
      key.classList.remove("recording");
      key.blur();
    });

    row.append(label, key);
    els.shortcutEditor.appendChild(row);
  }
}

/* ------------------------------------------------------------------ */
/* Wire up form events                                                 */
/* ------------------------------------------------------------------ */

function bind() {
  els.providerPreset.addEventListener("change", () => {
    const p = getProvider(els.providerPreset.value);
    renderProviderNote(p);
    if (p.id !== "custom") {
      els.apiBaseUrl.value = p.baseUrl;
      els.model.value = p.model;
    }
    els.apiStyle.value = "auto";
    syncKeyHint();
    syncStyleHint();
    setResult("");
    els.modelsState.textContent = "";
    void persist({ provider: p.id, apiBaseUrl: els.apiBaseUrl.value, model: els.model.value, apiStyle: "auto" });
    void ensureEndpointPermission(); // change event carries the user gesture
  });

  els.apiBaseUrl.addEventListener("change", () => {
    const normalized = normalizeBaseUrl(els.apiBaseUrl.value);
    if (normalized) els.apiBaseUrl.value = normalized;
    detectPreset();
    syncKeyHint();
    setResult("");
    void persist({ apiBaseUrl: normalized, provider: els.providerPreset.value });
    void ensureEndpointPermission();
  });

  els.apiStyle.addEventListener("change", () => {
    syncStyleHint();
    void persist({ apiStyle: els.apiStyle.value });
  });
  els.maxOutputTokens.addEventListener("change", () => {
    void persist({ maxOutputTokens: Number(els.maxOutputTokens.value) || DEFAULT_SETTINGS.maxOutputTokens });
  });
  els.maxImageEdge.addEventListener("change", () => {
    void persist({ maxImageEdge: Math.max(0, Number(els.maxImageEdge.value) || 0) });
  });

  els.apiKey.addEventListener("change", () => void persist({ apiKey: els.apiKey.value.trim() }));
  els.model.addEventListener("change", () => {
    void persist({ model: els.model.value.trim() }); // empty = "first served model" on local servers
  });
  els.extraInstructions.addEventListener("change", () => void persist({ extraInstructions: els.extraInstructions.value }));

  els.btnToggleKey.addEventListener("click", () => {
    const showing = els.apiKey.type === "text";
    els.apiKey.type = showing ? "password" : "text";
    els.btnToggleKey.textContent = showing ? "Show" : "Hide";
  });

  els.sourceSwitch.addEventListener("click", (e) => {
    const btn = e.target.closest?.(".seg-btn");
    if (btn?.dataset.source) void chooseSource(btn.dataset.source);
  });
  els.sourceSwitch.addEventListener("keydown", (e) => {
    if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) return;
    e.preventDefault();
    const next = captureSource === "image" ? "html" : "image";
    void chooseSource(next);
    els.sourceSwitch.querySelector(\`[data-source="\${next}"]\`)?.focus();
  });
  // Flipped from the popup or Alt+S while this page is open → mirror it.
  onSettingsChanged((settings) => {
    if (settings?.captureSource && settings.captureSource !== captureSource) renderSource(settings.captureSource);
  });
  els.htmlScope.addEventListener("change", () => void persist({ htmlScope: els.htmlScope.value }));
  els.htmlMaxChars.addEventListener("change", () => {
    const v = Math.max(1000, Number(els.htmlMaxChars.value) || DEFAULT_SETTINGS.htmlMaxChars);
    els.htmlMaxChars.value = v;
    void persist({ htmlMaxChars: v });
  });

  els.captureFormat.addEventListener("change", () => void persist({ captureFormat: els.captureFormat.value }));

  els.jpegQuality.addEventListener("input", () => {
    syncOutputs();
    persistLater({ jpegQuality: Number(els.jpegQuality.value) / 100 });
  });
  els.typingDelayMs.addEventListener("input", () => {
    syncOutputs();
    persistLater({ typingDelayMs: Number(els.typingDelayMs.value) });
  });
  els.typingJitterMs.addEventListener("input", () => {
    syncOutputs();
    persistLater({ typingJitterMs: Number(els.typingJitterMs.value) });
  });

  els.autoType.addEventListener("change", () => void persist({ autoType: els.autoType.checked }));
  els.clickChoice.addEventListener("change", () => void persist({ clickChoice: els.clickChoice.checked }));
  els.highlightMatches.addEventListener("change", () => void persist({ highlightMatches: els.highlightMatches.checked }));
  els.overlayPosition.addEventListener("change", () => void persist({ overlayPosition: els.overlayPosition.value }));
  els.theme.addEventListener("change", () => void themeCtl?.set(els.theme.value));

  els.btnReset.addEventListener("click", async () => {
    await resetSettings();
    await hydrate();
    markSaved();
  });
}

let themeCtl = null;
void initTheme({
  toggle: els.btnTheme,
  onChange: (mode) => {
    if (els.theme.value !== mode) els.theme.value = mode; // header toggle ↔ select stay in sync
  },
}).then((ctl) => {
  themeCtl = ctl;
});

populateProviderSelect();
void hydrate().then(refreshLog);
void renderShortcutEditor();
bind();

`,XA='# QuizKey: AI Quiz Assistant (Manifest V3)\n\nPress a keyboard shortcut → QuizKey captures the quiz, **as a screenshot or as\nthe page\'s HTML, your choice**, sends it to an AI model, detects the question\nand answers, then types the best answer into the page with **realistic,\nper-character keyboard events**, never a paste.\n\n> Use responsibly and respect the academic-integrity and site policies that\n> apply to you.\n\n---\n\n## Project structure\n\n```\nextension/\n├── manifest.json               # MV3 manifest: permissions, commands, wiring\n├── background/\n│   └── service-worker.js       # Orchestrator: commands → capture → AI → messaging\n├── content/\n│   ├── content-script.js       # Message router (background ↔ DOM modules)\n│   ├── dom-detector.js         # Finds question, answer options & input fields\n│   ├── page-extractor.js       # "HTML" source: cleaned DOM extract of the visible quiz\n│   ├── typing-simulator.js     # Per-character keydown/keypress/input/keyup stream\n│   ├── overlay.js              # In-page status/result/error UI\n│   └── overlay.css             # Namespaced overlay styles (qk-*)\n├── popup/\n│   ├── popup.html / .css / .js # Quick actions, shortcuts, latest result\n├── options/\n│   ├── options.html / .css / .js # Full settings: API, capture, typing, shortcuts\n├── lib/\n│   ├── ai-client.js           # facade over lib/adapters/*            # OpenAI-compatible vision client + JSON validation\n│   ├── prompts.js              # System prompt & message construction\n│   ├── storage.js              # Settings + per-tab results (chrome.storage.local)\n│   └── errors.js               # Error codes → user-facing messages\n└── icons/\n    └── icon.png\n```\n\n### Data flow\n\n```\nAlt+Q ─► commands API ─► service worker ─► source switcher\n                             ├─ image? ─► tabs.captureVisibleTab ─► downscale\n                             └─ html?  ─► content-script ─► page-extractor (cleaned DOM)\n                                     │\n                                     ▼\n               ai-client.js ──► AI model ──► validated JSON\n                                     │\n                    saveResult ◄─────┘\n                                     ▼\n              content-script ─► overlay (question, answer, confidence)\n                              └► dom-detector highlights matches\n\nAlt+A ─► service worker ─► stored result ─► content-script\n        ├─ choice? ─► dom-detector.findChoiceElement ─► pointer/click replay\n        └─ text?   ─► dom-detector.findInputField\n                    ─► typing-simulator.typeText (delay + jitter, char by char)\n```\n\n---\n\n## Installation (Chromium: Chrome, Edge, Brave, Arc…)\n\n1. Copy/download the `extension/` folder anywhere on disk.\n2. Open `chrome://extensions` (or `edge://extensions`).\n3. Enable **Developer mode** (top-right toggle).\n4. Click **Load unpacked** and select the `extension/` folder.\n5. Pin the extension, then open its **Options** page:\n   - paste your API key\n   - confirm/adjust the base URL and model\n   - tune typing delay & capture format\n\n## Quiz source switcher: Image or HTML\n\nQuizKey can feed the model two kinds of input. Pick one with the **Image / HTML**\nswitcher at the top of the popup, in **Settings → Quiz source**, or flip it on the\nfly with `Alt+S` (a toast confirms which source is active).\n\n| | **Image** (default) | **HTML** |\n| --- | --- | --- |\n| What is sent | A downscaled screenshot of the visible tab | A cleaned HTML extract of the quiz: headings, text, `<input type="radio">`, `<label>`, `<textarea>`, `<button>`, `role="radio"` widgets… |\n| Model requirement | Vision-capable | **Any** chat model (text-only local models work) |\n| Cost / speed | More tokens, image upload | Usually a few thousand characters, so cheaper and faster |\n| Strengths | Sees exactly what you see: images, canvas, embedded PDFs, math rendered as pictures | Exact text (no OCR errors), reads visually-hidden radio inputs, works when the question is long |\n| Limits | Small text, dense pages | Can\'t read questions that are themselves images; needs the content script (not on restricted pages) |\n\nHow the HTML extract is scoped (Settings → Quiz source):\n\n- **Selection first**: if you select ≥ 15 characters on the page, only that part is\n  analyzed. Handy on pages that show several questions at once.\n- **What\'s on screen** (default): everything intersecting the viewport, mirroring the\n  screenshot. Falls back to the whole page if nothing meaningful is on screen.\n- **Whole page**: the full document, for long scrolling quizzes.\n- **Max extract size** caps the characters sent (default 12 000); the model is told when\n  the extract was truncated.\n\nScripts, styles, layout wrappers, ids, classes, hidden fields, `display:none` decoys and\nQuizKey\'s own overlay are stripped before anything leaves the tab. The result is stored\nwith the analysis (`analysis.source`) and shown in the popup as *via HTML* / *via image*.\n**Run diagnostic** in settings follows the active source, so you can verify a text-only\nmodel with the HTML pipeline before using it on a real quiz.\n\n### Configure the keyboard shortcuts\n\n- Default: `Alt+Q` capture & analyze, `Alt+A` type answer, `Alt+S` switch quiz source.\n- Rebind from the Options page (supported browsers) or directly at\n  `chrome://extensions/shortcuts`.\n- Constraints set by Chromium: must include `Ctrl` or `Alt` (optionally\n  `Shift`); browser-reserved combos are rejected.\n\n## Supported AI providers\n\nQuizKey speaks **three API dialects natively** and picks the right one from the base\nURL (or you pin it under *API dialect* in settings):\n\n| Dialect | Endpoint QuizKey calls | Auth header |\n| --- | --- | --- |\n| OpenAI Chat Completions | `POST {base}/chat/completions` | `Authorization: Bearer` (Azure: `api-key`) |\n| Google Gemini (native) | `POST {base}/models/{model}:generateContent` | `x-goog-api-key` |\n| Anthropic Messages | `POST {base}/messages` | `x-api-key` + `anthropic-version` |\n\nPresets (all URLs verified against the providers\' documentation, Sept 2026):\n\n| Provider | Base URL | Default model | Notes |\n| --- | --- | --- | --- |\n| **OpenAI** | `https://api.openai.com/v1` | `gpt-4o-mini` | Also `gpt-4o`, `gpt-5.6-terra`, `gpt-5.6-sol`. GPT‑5.x reject `temperature`/`max_tokens`; QuizKey adapts automatically. |\n| **Anthropic Claude** | `https://api.anthropic.com/v1` | `claude-sonnet-5` | Native Messages API. Also `claude-haiku-4-5-20251001`, `claude-opus-5`. Sonnet 5 rejects non-default sampling params, so they are never sent. |\n| **Google Gemini (native)** | `https://generativelanguage.googleapis.com/v1beta` | `gemini-3.8-flash` | Recommended for Gemini. Key from [AI Studio](https://aistudio.google.com/apikey). Gemini 3 always thinks; QuizKey asks for `thinkingLevel: low` + JSON output. |\n| **Google Gemini (OpenAI layer)** | `https://generativelanguage.googleapis.com/v1beta/openai` | `gemini-3.8-flash` | Same key. Google labels this layer beta; prefer the native preset. |\n| **OpenRouter** | `https://openrouter.ai/api/v1` | `openai/gpt-4o-mini` | One key, many models; pick one with image input. |\n| **OmniRoute** (local gateway) | `http://localhost:20128/v1` | `gemini-3-flash` | `npm i -g omniroute && omniroute`; key from Dashboard → Endpoints. Model IDs are plain names (`gemini-3-flash`, `auto`, `claude-sonnet-4-5`). Use a vision model, since `auto` may route to a text-only one. |\n| **LM Studio** (local) | `http://localhost:1234/v1` | *(empty → first loaded)* | Enable **CORS** in the Developer tab. Click **Grant access** in QuizKey settings. |\n| **Ollama** (local) | `http://localhost:11434/v1` | `llama3.2-vision` | `OLLAMA_ORIGINS="*" ollama serve` then `ollama pull llama3.2-vision` (or `qwen2.5vl`, `gemma3`). Click **Grant access**. |\n| **Azure OpenAI** | `https://RES.openai.azure.com/openai/deployments/DEP` | your deployment | QuizKey adds `api-key` header + `api-version` query. |\n| **Custom** | any OpenAI-compatible `/v1` | none | vLLM, llama.cpp, Groq, Mistral, xAI, Together… |\n\nOpenAI, Anthropic, Gemini and OpenRouter are granted in the manifest. For any other\norigin QuizKey requests the optional host permission the moment you change the base\nURL (and via **Grant access** / **Test connection**). Without that grant the request is\nsubject to CORS, which local servers block. That is the usual cause of "nothing happens".\n\n### Provider-quirk handling (why earlier versions "didn\'t work")\n\n- **Reasoning models** (Gemini 2.5/3.x, GPT‑5.x, o‑series, Claude 4.6+/5, DeepSeek‑R1…)\n  get a 4096‑token output budget, low reasoning effort and **no `temperature`**.\n  Otherwise hidden thinking eats the whole budget and the reply is empty.\n- A `400` complaining about `max_tokens`, `temperature`, `response_format`,\n  `reasoning_effort` / `thinkingConfig` is retried with that parameter fixed\n  (`max_tokens → max_completion_tokens`, JSON mode dropped, …); the quirk is remembered.\n- A base URL missing `/v1` (e.g. `http://localhost:11434`) is retried with it; pasted\n  endpoint suffixes (`/chat/completions`, `/messages`, `:generateContent`) are stripped.\n- `message.content` may be a string or an array of parts; Gemini thought parts are skipped.\n- Local endpoints don\'t require an API key; an empty model on LM Studio means "first loaded".\n- The provider\'s own error text (wrong key, unknown model, quota…) is shown in the toast\n  and in **Settings → Recent API calls**.\n- The overlay and outlines are hidden **before** the screenshot so the model never sees\n  a previous answer card.\n\n### Debugging a provider\n\nSettings → **Test connection** lists the endpoint\'s models (and warns if yours isn\'t\nthere), **Load models** fills the model picker, and **Run diagnostic** sends a built-in\nsample quiz image through the real capture → analyze pipeline and prints the parsed\nanswer or the exact provider error. **Recent API calls** shows URL, status and timing\nof the last requests (keys are never logged).\n\n## Configuration reference\n\n| Key | Type | Default | Description |\n| --- | --- | --- | --- |\n| `provider` | string | `openai` | Preset id from `lib/providers.js`. |\n| `apiStyle` | `auto` \\| `openai` \\| `gemini` \\| `anthropic` | `auto` | API dialect; `auto` infers it from the URL. |\n| `apiBaseUrl` | string | `https://api.openai.com/v1` | Provider base URL. Custom hosts request optional host permission. |\n| `apiKey` | string | `""` | Stored only in `chrome.storage.local`; sent only to the endpoint. Optional for localhost / LAN endpoints. |\n| `requestTimeoutMs` | number | `90000` | Abort threshold; reasoning models can take a while. |\n| `maxOutputTokens` | number | `4096` | Completion budget (sent as `max_tokens`, or `max_completion_tokens` when the provider demands it). Must be large for reasoning models. |\n| `maxImageEdge` | number | `1600` | The screenshot is downscaled in the worker so its longest edge is ≤ this, for a smaller upload and fewer vision tokens. `0` disables. |\n| `model` | string | `gpt-4o-mini` | Any chat model; must accept images when `captureSource` is `image`. Empty = first model the server lists (local servers). |\n| `captureSource` | `"image"\\|"html"` | `image` | Quiz source: screenshot of the tab, or a cleaned extract of the page HTML. |\n| `htmlScope` | `"viewport"\\|"page"` | `viewport` | HTML source: what\'s on screen, or the whole document. A text selection always takes precedence. |\n| `htmlMaxChars` | number | `12000` | HTML source: character cap for the extract sent to the model. |\n| `requestTimeoutMs` | number | `45000` | Hard abort for AI requests. |\n| `captureFormat` | `"png"\\|"jpeg"` | `jpeg` | Screenshot encoding (Image source only). |\n| `jpegQuality` | number | `0.85` | 0.1 to 1.0, ignored for PNG. |\n| `typingDelayMs` | number | `60` | Base delay between keystrokes. |\n| `typingJitterMs` | number | `45` | Random 0…n ms added per keystroke. |\n| `autoType` | boolean | `false` | Type right after analysis (skip `Alt+A`). |\n| `clickChoice` | boolean | `true` | Click detected MCQ options with pointer events. |\n| `highlightMatches` | boolean | `true` | Outline detected question/field/answer. |\n| `extraInstructions` | string | `""` | Appended to the analysis prompt. |\n| `overlayPosition` | string | `top-right` | Where the in-page panel appears. |\n\n## Typing realism\n\nEach character dispatches the exact sequence a physical keyboard produces:\n\n`keydown → keypress → beforeinput → (native value mutation) → input → keyup`\n\n- Uses the **native value setter**, so React/Vue/Angular controlled inputs\n  register every keystroke.\n- Respects caret position and selection ranges; supports `contenteditable`\n  via `insertText`.\n- Respects `preventDefault()`: if the page vetoes a key, the simulator\n  skips it instead of forcing state.\n- Human cadence: configurable base delay, random jitter, longer pauses at\n  word boundaries and after punctuation.\n\n## Error handling\n\nEvery failure path produces a typed `QuizKeyError` with a stable code and a\nuser-facing message shown as an on-page toast and in the popup:\n\n`CAPTURE_FAILED` · `EXTRACT_FAILED` · `API_KEY_MISSING` · `API_TIMEOUT` · `API_REQUEST_FAILED` ·\n`NO_QUESTION` · `NO_ANSWER` · `NO_RESULT` · `NO_INPUT` · `MESSAGING_FAILED` ·\n`RESTRICTED_PAGE` …\n\nThe action badge mirrors state: `…` working, `✓` success, `!` failure.\n\n## Security notes\n\n- MV3 with a **module service worker**; no remote code, no `eval`.\n- Minimal permissions: `activeTab` (granted by the shortcut gesture),\n  `storage`, `commands`, `scripting` (only for on-demand injection on tabs\n  opened before install). The API host is a host-permission; custom endpoints\n  use **optional** host permissions requested at runtime.\n- The API key never enters page context; AI calls happen only in the\n  background worker.\n- Content scripts run in the isolated world and communicate via typed\n  messages only.\n\n## Troubleshooting\n\n### “This page is restricted…”: what it means and what to do\n\nQuizKey classifies the tab and tells you the exact cause. The cases:\n\n| Page kind | Why | What you can do |\n| --- | --- | --- |\n| `chrome://` / `edge://` / `brave://` / `about:` pages (settings, history, new tab…) | Chromium blocks **every** extension from capturing or scripting built-in pages. | Nothing you can change. Open a normal website; this is not fixable by design. |\n| Web Store / extension galleries | Same hard browser rule, even over https. | Nothing you can change. Capture quiz pages on regular sites instead. |\n| Built-in **PDF viewer** | It runs inside a privileged extension page. | Download the PDF or move the question to a web page. |\n| `file://` local files | **Capture/analysis works out of the box.** Typing & the overlay need a per-extension file grant (browser security rule). | **QuizKey Settings → “Local files (file://)” → Enable file access** (one click), then reopen the file. If you prefer Chrome\'s own switch: `chrome://extensions → QuizKey → Details → “Allow access to file URLs”`. Note that Chrome can hide that toggle unless the extension declares URL permissions (QuizKey deliberately asks at runtime instead). |\n| Grant seems ignored / file still silent | Couldn\'t see WHY without a visible error. The hidden cause: the model answered prose instead of JSON. | QuizKey now surfaces the model\'s best-effort prose answer in the overlay instead of failing silently. Use a stronger vision model if the question is image-heavy. |\n| Tab was open **before** install/reload | Its content script is missing. | QuizKey **auto-injects on capture** (via `chrome.scripting`). If you still see a messaging error, reload that tab once. |\n\n### Other common issues\n\n- **“Unreadable response” / empty reply**: the model is not vision-capable, or spent its\n  output budget on reasoning. Use a vision model; for reasoning models keep `maxOutputTokens`\n  ≥ 4096. Prose replies are now shown as a low-confidence answer instead of failing.\n- **“No permission to contact …”**: open settings and click **Grant access** next to the\n  base URL (custom / local endpoints only; OpenAI, Gemini and OpenRouter are pre-granted).\n- **Local server unreachable**: Ollama: `OLLAMA_ORIGINS="*" ollama serve`; LM Studio: turn\n  on CORS. Both need the host-permission grant above.\n- **HTTP 400 on GPT‑5 / o‑series**: handled automatically (`max_completion_tokens`, no\n  `temperature`); if a provider rejects another parameter the toast now shows its exact text.\n- **Test connection fails on OmniRoute/gateways**: QuizKey first tries `GET /models`,\n  then falls back to a 1-token chat ping automatically.\n- **Gemini gives NO_ANSWER on dense pages**: lower the JPEG quality slider or use\n  a stronger model (e.g. `gemini-3.8-pro`).\n- **Nothing types**: focus the target field once, then press `Alt+A`; the\n  focused field always wins over heuristics.\n- **HTML source says NO_QUESTION**: the question is probably an image or canvas;\n  switch to the Image source (`Alt+S`). If several questions are on screen, select the\n  one you want first. On a fully scrolled page, set the HTML scope to *Whole page*.\n- **HTML source: "The page HTML could not be read"**: the content script isn\'t attached\n  (restricted page, or a tab opened before install). Reload the tab once; the Image\n  source doesn\'t need the content script for capture and can be used meanwhile.\n',va=[{path:"manifest.json",lang:"json",code:EA},{path:"background/service-worker.js",lang:"js",code:AA},{path:"lib/storage.js",lang:"js",code:_A},{path:"lib/ai-client.js",lang:"js",code:kA},{path:"lib/providers.js",lang:"js",code:MA},{path:"lib/http.js",lang:"js",code:CA},{path:"lib/analysis.js",lang:"js",code:zA},{path:"lib/adapters/openai.js",lang:"js",code:jA},{path:"lib/adapters/gemini.js",lang:"js",code:NA},{path:"lib/adapters/anthropic.js",lang:"js",code:OA},{path:"lib/prompts.js",lang
